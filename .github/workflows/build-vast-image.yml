name: Build Vast container image

on:
  push:
    branches:
      - vast-ai-serverless-rtx-pro-6000
      - vast-mouth-control-v1
    paths:
      - Dockerfile.vast
      - deploy/**
      - vast/**
      - .github/workflows/build-vast-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vast-rtx-pro-6000-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samuellucky2424-afk/joyai-video-edit

jobs:
  build-and-push:
    name: Build and publish Vast RTX PRO 6000 image
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Free disk space for the CUDA image
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check out the selected Vast branch
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the container image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile.vast
          platforms: linux/amd64
          push: true
          build-args: |
            MAX_JOBS=2
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:vast-rtx-pro-6000
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:vast-rtx-pro-6000-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=JoyAI Video Edit Vast validation image for RTX PRO 6000 Blackwell at 840x480 24 FPS

      - name: Show immutable validation image
        run: echo "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
