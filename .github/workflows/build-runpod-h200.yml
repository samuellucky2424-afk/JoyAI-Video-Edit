name: Build RunPod H200 container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - .dockerignore
      - .github/workflows/build-runpod-h200.yml
      - Dockerfile.h200
      - deploy/**
      - runpod/**

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: runpod-h200-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samuellucky2424-afk/joyai-video-edit

jobs:
  build-and-push:
    name: Build and publish H200 image
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Free disk space for the CUDA image
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report H200 image build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload=$(jq -nc \
            --arg state pending \
            --arg context runpod-h200-image \
            --arg description "Building the immutable RunPod H200 image" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"

      - name: Build and publish the H200 container image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile.h200
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            MAX_JOBS=2
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runpod-h200
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:h200-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=JoyAI Video Edit for RunPod H200

      - name: Show immutable deployment reference
        run: echo "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"

      - name: Report H200 image build result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=failure
          description="RunPod H200 image build failed"
          if [ "${BUILD_OUTCOME}" = "success" ]; then
            state=success
            description="Immutable RunPod H200 image published"
          fi
          payload=$(jq -nc \
            --arg state "${state}" \
            --arg context runpod-h200-image \
            --arg description "${description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}"
